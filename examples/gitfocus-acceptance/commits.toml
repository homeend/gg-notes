summary = "Review: 4e55504 Merge branch 'fix/worktrees-fit-rounding' (4e55504^..4e55504)"
rationale = "**Review could not run as specified.** The target is the merge commit `4e55504` (branch `fix/worktrees-fit-rounding`, single commit `b434be1`), but every Bash invocation in this context was denied (\"requires approval\" — including plain `ls`), and the sandboxed `ctx_execute` and memory `get_observations` tools were ungranted too. Git objects are zlib-compressed, so `Read` cannot produce the diff. **To get the real diff-scoped review, run `git diff 4e55504^..4e55504` (from `/home/homeend/git-focus`) and pass the text back, or grant Bash.**\n\nWhat I could do: a **working-tree review** of the files the fix plausibly touched, identified from the commit message (\"a branch that fits its row was cut by a pixel of measurement rounding\"), the reflog (`.git/logs/HEAD:321`), and memory hints (\"Fix text-fitting rounding error with kerned metrics\", 0.21.1 \"UI branch truncation fix\"):\n- `/home/homeend/git-focus/src/main/kotlin/dev/gitfocus/worktrees/RowTextFit.kt` (`fitLeft`/`fitLeftMiddle` measure branch+suffix joined — the fix itself)\n- `/home/homeend/git-focus/src/main/kotlin/dev/gitfocus/worktrees/WorktreesPanel.kt` (`ItemRenderer.fit()`, `FIT_SLACK`)\n- `/home/homeend/git-focus/src/test/kotlin/dev/gitfocus/worktrees/RowTextFitTest.kt` (kerned-metrics regression tests)\n- `/home/homeend/git-focus/src/main/kotlin/dev/gitfocus/worktrees/WorktreesList.kt` (verified `removePrefix` suffix derivation is sound; no finding)\n\nAngles B (removed behavior) and C (caller trace) were not executable without the diff and grep. Nothing below is a claim about what the merge *introduced*; each is \"in the current code\". No CLAUDE.md violation is quotable (non-ff `fix/…` merge matches the worktree workflow).\n\n```json\n[\n  {\n    \"file\": \"src/main/kotlin/dev/gitfocus/worktrees/WorktreesPanel.kt\",\n    \"line\": 448,\n    \"summary\": \"fit() measures text with the list's FontMetrics (list.getFontMetrics(left.font)) while the JBLabels paint with their own; JComponent.getFontMetrics routes through SwingUtilities2 and honors the component's AA/fractional-metrics client property, which JBList and JBLabel can carry differently, so a one-pixel rounding mismatch of the same class the fix targeted can still occur (plausible; working-tree review).\",\n    \"failure_scenario\": \"LaF/UISettings give the list and labels different AA text hints (int vs fractional metrics) -> a branch measured as fitting by the list's metrics is 1px wider under the label's metrics -> JLabel elides it with '...' even though RowTextFit said it fits; FIT_SLACK=2 masks it only up to 2px. Fix: left.getFontMetrics(left.font) / right.getFontMetrics(right.font).\"\n  },\n  {\n    \"file\": \"src/main/kotlin/dev/gitfocus/worktrees/WorktreesPanel.kt\",\n    \"line\": 481,\n    \"summary\": \"FIT_SLACK=2 is a slack heuristic subtracted from the available width to hide measurement mismatch rather than eliminating it; with joined measurement (RowTextFit.fitLeft) and same-component metrics the slack should be unnecessary (altitude).\",\n    \"failure_scenario\": \"Any residual mismatch larger than 2px (different fonts/scales/AA settings) still clips; meanwhile every row permanently loses 2px of name width. Root-cause form: measure with the painting component's metrics and drop the slack.\"\n  },\n  {\n    \"file\": \"src/main/kotlin/dev/gitfocus/worktrees/WorktreesPanel.kt\",\n    \"line\": 454,\n    \"summary\": \"fit() reads close.preferredSize.width before close.icon is assigned for the current cell (line 431), so the reserved X-column width comes from the previous cell's icon.\",\n    \"failure_scenario\": \"Today Close / CloseHovered / EmptyIcon.ICON_16 are all 16px so it is inert, but any icon-size change (or a non-16 EmptyIcon) makes every row's fit off by the difference, silently clipping the name label. Move the close.icon assignment above the fit() calls.\"\n  },\n  {\n    \"file\": \"src/main/kotlin/dev/gitfocus/worktrees/RowTextFit.kt\",\n    \"line\": 63,\n    \"summary\": \"fitLeft/fitLeftMiddle return ELLIPSIS + suffix even when that alone exceeds max, so the left label can be wider than the width split() granted it.\",\n    \"failure_scenario\": \"Very narrow tool window with a row like 'main (main) (this window)': split.left < width('… (main) (this window)') -> left label (BorderLayout WEST, preferred width) overshoots -> the CENTER name label is squeezed and JLabel adds its own '...' on top of fitMiddle's ellipsis (double ellipsis / hidden name). Not a crash; low.\"\n  },\n  {\n    \"file\": \"src/main/kotlin/dev/gitfocus/worktrees/WorktreesPanel.kt\",\n    \"line\": 457,\n    \"summary\": \"The renderer's composition that the kerning fix depends on (leftFull measured joined via leftFor(Int.MAX_VALUE), then split(), then re-fit to split.left) lives in private Swing code with no test; only the pure RowTextFit layer has the kerned regression tests.\",\n    \"failure_scenario\": \"A future edit that computes leftFull as leftWidth(branch) + leftWidth(suffix) (measuring apart again) reintroduces the exact 1px bug and the suite stays green. Extract the fixed/available arithmetic into a pure RowTextFit function taking widths so it can be covered like split().\"\n  },\n  {\n    \"file\": \"src/main/kotlin/dev/gitfocus/worktrees/RowTextFit.kt\",\n    \"line\": 83,\n    \"summary\": \"longestTail and fitMiddle are linear scans calling widthOf (FontMetrics.stringWidth, itself O(n)) once per candidate, and fit() re-runs them for every visible cell on each repaint, including the list.repaint() fired on every hover change (WorktreesPanel.kt:178).\",\n    \"failure_scenario\": \"Long branch names in a narrow window: O(n^2) string measurement per cell per mouse-move over the X column. Width is monotone in kept, so a binary search (or caching per item+width) is the cheaper form. Low.\"\n  }\n]\n```"
