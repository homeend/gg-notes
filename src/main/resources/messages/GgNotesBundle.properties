# All user-visible strings. "AgentNotes" is the product name and stays untranslated. Keys keep the
# old GgNotes spelling: action, tool window and notification ids are frozen (keymaps, saved layouts).
plugin.name=AgentNotes
startup.ready=AgentNotes loaded for project {0}
# The tool window's visible name (stripe button and header). Its id stays "GgNotes": saved
# layouts, OverviewService.TOOL_WINDOW_ID and the notification group refer to the id.
toolwindow.stripe.GgNotes=Agent Notes

# Registered actions and groups (plugin.xml convention keys).
group.GgNotes.Toolbar.text=AgentNotes
action.GgNotes.Refresh.text=Refresh Overviews
action.GgNotes.Refresh.description=AgentNotes: re-read the gg notes store of every repository
action.GgNotes.PreviousAnchor.text=Previous Anchor
action.GgNotes.PreviousAnchor.description=AgentNotes: go to the previous anchor of the open overview
action.GgNotes.NextAnchor.text=Next Anchor
action.GgNotes.NextAnchor.description=AgentNotes: go to the next anchor of the open overview
action.GgNotes.BackToOverview.text=Back to Overview
action.GgNotes.BackToOverview.description=AgentNotes: return to the open overview, on the anchor you left
action.GgNotes.Close.text=Close Overview
action.GgNotes.Close.description=AgentNotes: close the open overview and remove its remarks from the editors
action.GgNotes.DocumentOnly.text=Document Only
action.GgNotes.DocumentOnly.description=AgentNotes: hide the list so the document takes the whole tool window; press again to show the list
action.GgNotes.DocumentOnly.showList=Show List
group.GgNotes.ViewMode.text=View
action.GgNotes.ViewByDate.text=By Date
action.GgNotes.ViewByDate.description=AgentNotes: list notes by the day they were added
action.GgNotes.ViewByType.text=By Type
action.GgNotes.ViewByType.description=AgentNotes: list notes by what they belong to (branch, commit, pull request, file, other), then by day
action.GgNotes.RemoveFromStore.text=Delete
action.GgNotes.RemoveFromStore.description=AgentNotes: delete this row's records from gg's notes store (gg does it; every gg tool loses them)

# "Delete": the confirmation per row kind ({0} = what the row shows, {1} = record count).
remove.confirm.title=Delete
action.GgNotes.RemoveFromSession.text=Delete
remove.confirm.SESSION=Delete the session overview "{0}" ({1})? Its file is removed from the worktree's session docs; every gg reader of this worktree loses it.
# Copy Link: one line naming a session document, its worktree and its file, for an agent to read.
action.GgNotes.CopyLink.text=Copy Link
action.GgNotes.CopyLink.description=AgentNotes: copy a line that names this session overview and its file; paste it to an agent
action.GgNotes.CopySessionNoteLink.text=Copy Session Note Link
action.GgNotes.CopySessionNoteLink.description=AgentNotes: copy a line that names the session note at the caret and its file; paste it to an agent
# The editor's menu on a file with session notes.
action.GgNotes.DeleteSessionNote.text=Delete Session Note
action.GgNotes.DeleteSessionNote.description=AgentNotes: remove the session note at the caret (its file in the worktree's session docs)
action.GgNotes.DeleteSessionNotesOnFile.text=Delete All Session Notes on This File
action.GgNotes.DeleteSessionNotesOnFile.description=AgentNotes: remove every session note file on this file
remove.confirm.SESSION_WITH_NOTES=Delete the session overview "{0}" ({1}) and the {2} session notes it links? Their files are removed from the worktree's session docs; every gg reader of this worktree loses them.
action.GgNotes.RemoveCommit.text=Remove Everything on This Commit
action.GgNotes.RemoveCommit.description=AgentNotes: delete every overview, review and note of this item's commit from gg's notes store (gg does it)
remove.confirm.SESSION_NOTE=Delete the session note "{0}" ({1})? Its file is removed from the worktree's session docs; every gg reader of this worktree loses it.
remove.confirm.SESSION_FILE=Delete all {1} session notes on {0}? Their files are removed from the worktree's session docs; every gg reader of this worktree loses them.

# The session group: the overview files of the worktree's session docs directory (the header is the whole badge).
toolwindow.session=Session
toolwindow.shown=on screen
toolwindow.unresolved={0} unresolved
# Row badges: what an overview or review refers to beyond its commit (gg: commit | on-branch | was-tip | pr).
toolwindow.badge.pr=PR #{0}
toolwindow.badge.branch=branch {0}
toolwindow.badge.wasTip=was {0}
toolwindow.badge.range=range
toolwindow.badge.preview=preview
toolwindow.badge.pair=pair
toolwindow.badge.working=working
toolwindow.session.tooltip=Overviews an agent wrote for this worktree (gg session overview add, or files in its session docs directory). Every gg reader of the worktree shows them; they stay until deleted.
remove.confirm.OVERVIEW=Delete the overview "{0}", its replies and the notes shown under it ({1} records)?
remove.confirm.REVIEW=Delete the review "{0}", its replies and the notes shown under it ({1} records)?
remove.confirm.THREAD=Delete the note at {0} and its replies?
remove.confirm.REPLY=Delete the reply "{0}"?
remove.confirm.FILE=Delete every note on {0} ({1} threads) and their replies?
remove.confirm.COMMIT=Delete everything under commit {0} ({1} records) from gg's store?
remove.confirm.WORKING=Delete every working-tree review and note of {0} ({1} records)?
remove.confirm.note=gg deletes them from its notes store; every gg tool loses them.
remove.failed=AgentNotes: gg refused the removal:\n{0}

toolwindow.empty=No gg notes for this repository
toolwindow.working=Working tree
toolwindow.resolved=resolved
toolwindow.draft=draft reply to a GitHub thread
toolwindow.old=old side
toolwindow.replies={0} replies
toolwindow.scoped=notes in this scope
toolwindow.treeChanged=tree has changed
