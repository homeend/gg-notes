# All user-visible strings. "GgNotes" is the product name and stays untranslated.
plugin.name=GgNotes
startup.ready=GgNotes loaded for project {0}
# The tool window's visible name (stripe button and header). Its id stays "GgNotes": saved
# layouts, OverviewService.TOOL_WINDOW_ID and the notification group refer to the id.
toolwindow.stripe.GgNotes=Overviews

# Registered actions and groups (plugin.xml convention keys).
group.GgNotes.Toolbar.text=GgNotes
action.GgNotes.Refresh.text=Refresh Overviews
action.GgNotes.Refresh.description=GgNotes: re-read the gg notes store of every repository
action.GgNotes.PreviousAnchor.text=Previous Anchor
action.GgNotes.PreviousAnchor.description=GgNotes: go to the previous anchor of the open overview
action.GgNotes.NextAnchor.text=Next Anchor
action.GgNotes.NextAnchor.description=GgNotes: go to the next anchor of the open overview
action.GgNotes.BackToOverview.text=Back to Overview
action.GgNotes.BackToOverview.description=GgNotes: return to the open overview, on the anchor you left
action.GgNotes.Close.text=Close Overview
action.GgNotes.Close.description=GgNotes: close the open overview and remove its remarks from the editors
action.GgNotes.DocumentOnly.text=Document Only
action.GgNotes.DocumentOnly.description=GgNotes: hide the list so the document takes the whole tool window; press again to show the list
action.GgNotes.DocumentOnly.showList=Show List
action.GgNotes.RemoveFromStore.text=Delete
action.GgNotes.RemoveFromStore.description=GgNotes: delete this row's records from gg's notes store (gg does it; every gg tool loses them)

# "Delete": the confirmation per row kind ({0} = what the row shows, {1} = record count).
remove.confirm.title=Delete
action.GgNotes.RemoveFromSession.text=Delete
remove.confirm.SESSION=Delete the in-memory overview "{0}" ({1})? It is not in gg's store; this only drops it from this IDE session.

# The in-memory group: overviews from `gg session overview add --to ide` (the header is the whole badge).
toolwindow.session=In memory
toolwindow.inMemory=in memory
toolwindow.shown=on screen
toolwindow.unresolved={0} unresolved
# Row badges: what an overview or review refers to beyond its commit (gg: commit | on-branch | was-tip | pr).
toolwindow.badge.pr=PR #{0}
toolwindow.badge.branch=branch {0}
toolwindow.badge.wasTip=was {0}
toolwindow.badge.range=range
toolwindow.badge.preview=preview
toolwindow.badge.pair=pair
toolwindow.badge.working=working
toolwindow.session.tooltip=Overviews an agent added to this IDE session (gg session overview add --to ide). They are not in gg's store and disappear when the project closes.
remove.confirm.OVERVIEW=Delete the overview "{0}" and its replies?
remove.confirm.REVIEW=Delete the review "{0}", its replies and the notes shown under it ({1} records)?
remove.confirm.THREAD=Delete the note at {0} and its replies?
remove.confirm.REPLY=Delete the reply "{0}"?
remove.confirm.FILE=Delete every note on {0} ({1} threads) and their replies?
remove.confirm.COMMIT=Delete everything under commit {0} ({1} records) from gg's store?
remove.confirm.WORKING=Delete every working-tree review and note of {0} ({1} records)?
remove.confirm.note=gg deletes them from its notes store; every gg tool loses them.
remove.failed=GgNotes: gg refused the removal:\n{0}

toolwindow.empty=No gg notes for this repository
toolwindow.working=Working tree
toolwindow.resolved=resolved
toolwindow.draft=draft reply to a GitHub thread
toolwindow.old=old side
toolwindow.replies={0} replies
toolwindow.scoped=notes in this scope
toolwindow.treeChanged=tree has changed
working.tree=the working tree
toolwindow.noGit=No Git repository in this project
toolwindow.newerFormat={0}: the gg store was written by a newer gg and may be incomplete
toolwindow.unknownCommit=(commit not in this repository)
toolwindow.cannotRender=cannot render

document.none=Select an overview
document.anchors={0} anchors
document.cannotRender=This overview cannot be rendered: {0}

banner.text=GgNotes overview "{0}"
banner.text.anchor=GgNotes overview "{0}" · anchor {1} of {2}: {3}
banner.back=Back to overview
banner.previous=Previous anchor
banner.next=Next anchor

